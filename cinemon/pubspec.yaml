name: cinemon
description: A new Flutter project.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# Bump the build number (+N) on EVERY TestFlight upload — App Store Connect
# permanently rejects a build number it has already seen for a given version.
# Shipped so far: 1.0.0 (1), 1.0.0 (2) — both Jan 18 2026.
version: 1.1.1+7

environment:
  sdk: ">=3.0.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.2

  # State Management
  flutter_riverpod: ^2.4.0

  # Backend (Supabase)
  supabase_flutter: ^2.9.0
  # For the client that notes content-filter refusals (content_refusal.dart).
  http: ^1.1.0

  # Networking (TMDB API)
  dio: ^5.4.0

  # Image Handling
  cached_network_image: ^3.3.0
  image_picker: ^1.0.5
  image_cropper: ^8.0.2

  # Navigation
  go_router: ^12.1.0

  # UI Enhancements
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  gif: ^2.3.0

  # Data Models (annotations)
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.0
  record: ^6.2.1
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  youtube_player_iframe: ^6.0.2
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  shared_preferences: ^2.3.0
  sign_in_with_apple: ^7.0.1
  google_sign_in: ^7.2.0
  crypto: ^3.0.7
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

  # Code Generation
  build_runner: ^2.4.6
  freezed: ^2.4.5
  json_serializable: ^6.7.1

  # App Icon Generator
  flutter_launcher_icons: ^0.13.1

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/35mmapp.png"
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/images/stickers/
    - assets/top3elements/
    - assets/badges/
    - assets/share/
    # Font licences, shown on Settings → About → Licences.
    - assets/fonts/OFL-3disometric.txt
    - assets/fonts/share/OFL-ibmplexmono.txt
    - assets/fonts/share/OFL-instrumentserif.txt
    - assets/fonts/share/OFL-bigshouldersdisplay.txt
    - assets/fonts/share/OFL-reeniebeanie.txt
    - assets/fonts/username/1001fonts-brafesuit-eula.txt

  # Custom fonts
  fonts:
    # Share cards (ADR 0003, D5). OFL licences sit next to the files.
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/share/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/share/InstrumentSerif-Italic.ttf
          style: italic
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/share/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/share/IBMPlexMono-SemiBold.ttf
          weight: 600
    - family: BigShoulders
      fonts:
        - asset: assets/fonts/share/BigShouldersDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/share/BigShouldersDisplay-Black.ttf
          weight: 900
    - family: ReenieBeanie
      fonts:
        - asset: assets/fonts/share/ReenieBeanie.ttf
    # Usernames (AppText.usernameFamily). Brafesuit by Dhabee Studio, 1001fonts
    # Free For Commercial Use licence, which allows embedding in an app.
    - family: Brafesuit
      fonts:
        - asset: assets/fonts/username/Brafesuit.ttf
    - family: Isometric3D
      fonts:
        - asset: assets/3DIsometricBold-Yqy68.ttf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

dependency_overrides:
  win32: ^5.10.0
