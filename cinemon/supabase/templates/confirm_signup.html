<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark light"><title>Your 35mm code</title></head>
<body style="margin:0;padding:0;background:#000000;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#000000;">
    <tr><td align="center" style="padding:40px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#1C1C1E;border-radius:20px;">
        <tr><td style="padding:32px 28px 8px 28px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;">
          <div style="font-size:15px;font-weight:700;letter-spacing:2px;color:#FFFFFF;">35MM</div>
        </td></tr>
        <tr><td style="padding:16px 28px 0 28px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;">
          <h1 style="margin:0 0 10px 0;font-size:24px;line-height:1.25;color:#FFFFFF;font-weight:700;">Welcome to 35mm</h1>
          <p style="margin:0;font-size:16px;line-height:1.5;color:#AEAEB2;">Enter this code in the app to finish creating your account.</p>
        </td></tr>
        <tr><td align="center" style="padding:28px;">
          <div style="display:inline-block;padding:16px 24px;border-radius:14px;background:#2C2C2E;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:34px;letter-spacing:10px;font-weight:700;color:#FFFFFF;">{{ .Token }}</div>
        </td></tr>
        <tr><td style="padding:0 28px 32px 28px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;">
          <p style="margin:0;font-size:14px;line-height:1.5;color:#8E8E93;">The code works for one hour. If you didn't sign up for 35mm, you can ignore this email.</p>
        </td></tr>
      </table>
      <p style="margin:20px 0 0 0;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;color:#636366;">35mm · <a href="https://35mm.contact/support" style="color:#8E8E93;">Support</a> · <a href="https://35mm.contact/privacy" style="color:#8E8E93;">Privacy</a></p>
    </td></tr>
  </table>
</body>
</html>
